# Test and cross-compile on every push to main and every pull request; publish
# a GitHub Release with the archives AND the Windows installers when a v* tag
# is pushed, or when the workflow is run by hand with a release_tag (Actions ->
# Build -> Run workflow): the tag is then created on the current commit by the
# release job.
#
# Nothing here uses Actions artifact storage. It used to: the build job
# uploaded the whole 168 MB dist/ on every push and the release job downloaded
# it. On a private repository that quota is 500 MB, so three pushes filled it
# and then every run failed at the upload step with "Artifact storage quota has
# been hit" - including the release. Release assets do not count against that
# quota, so the release job now builds and publishes in one place and ordinary
# pushes keep nothing.
#
# That is also why the release runs on Windows: it is the only platform that
# can produce the MSIs, it cross-compiles the other eight binaries perfectly
# well, and doing it in one job means one dist/ and therefore one SHA256SUMS
# covering everything the release offers. A Windows runner bills at twice the
# Linux rate, which is affordable once per release and is why the ordinary
# per-push job stays on Linux.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create this tag on the current commit and publish a release (e.g. v0.1.0). Leave empty for a plain build.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags for the version stamp

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true # go modules and build cache, keyed on go.sum

      - name: Web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Cross-compile and package
        # web/dist was just built, so `make server` embeds the fresh UI
        run: make server agents package

      - name: Console is really embedded
        # web/dist holds only .gitkeep in a clean checkout, so a server built
        # without the UI step embeds one empty file and compiles without a
        # warning - the archive would then ship a console that is a directory
        # listing. The Makefile refuses to build such a binary; this checks the
        # artefact itself, which is the thing that reaches an operator.
        run: |
          for f in dist/rmm-server-*; do
            grep -qa '<div id="root">' "$f" || {
              echo "::error::$f has no embedded web console (build the UI before packaging)"
              exit 1
            }
          done
          echo "all server binaries carry the console"

      - name: Show what was built
        run: |
          ls -l dist
          cat dist/SHA256SUMS

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stamp the requested release version
        # A manual release names its tag before it exists; a local tag makes
        # `git describe` (the version the build embeds) report it. The tag
        # itself is created on GitHub by the publish step below.
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: bash
        run: |
          case "${{ inputs.release_tag }}" in
            v[0-9]*) ;;
            *) echo "::error::release_tag must look like v1.2.3"; exit 1 ;;
          esac
          git tag "${{ inputs.release_tag }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: WiX Toolset
        # Pinned: an MSI authored against v7 is not guaranteed to build on
        # whatever major version ships next, and a release is the worst moment
        # to discover that. The EULA has to be accepted non-interactively or
        # `wix build` refuses to run at all.
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.0.0
          wix --version
          wix eula accept wix7
          wix extension add -g WixToolset.Util.wixext/7.0.0

      - name: Build everything
        # The same command a release is built with by hand, so what ships is
        # what was tested locally: nine binaries, six archives, two MSIs and one
        # SHA256SUMS covering all of them.
        shell: pwsh
        run: ./tools/build.ps1 -Target all,package,msi,checksums

      - name: Console is really embedded
        # Repeated for the binary that goes inside the MSI, which is a different
        # one from the Linux job's.
        shell: bash
        run: |
          grep -qa '<div id="root">' dist/rmm-server-windows-amd64.exe || {
            echo "::error::the packaged server has no embedded web console"
            exit 1
          }
          ls -l dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/homelab-rmm-*.zip
            dist/homelab-rmm-*.tar.gz
            dist/*.msi
            dist/SHA256SUMS
