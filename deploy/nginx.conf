# nginx in front of Homelab RMM.
#
# Run the server with plain HTTP and its public URL set to the proxy name:
#
#   rmm-server run --insecure --listen 127.0.0.1:8080 --public-url https://rmm.example.lan \
#       --trusted-proxies 127.0.0.1
#
# Every route the browser and the agents use must pass through unchanged:
#   /ws/agent            agent WebSocket (long-lived, one per device)
#   /ws/desktop-agent    desktop helper WebSocket (binary frames, up to 32 MB)
#   /ws/shell/*          terminal, /ws/desktop/* remote desktop viewer
#   /api/events          Server-Sent Events (needs buffering off)
#   /api/agent-download  agent binaries (tens of MB), /install/<token> scripts
#
# The server compares the WebSocket Origin header with the Host header it
# receives, so Host must be forwarded verbatim. X-Forwarded-For becomes the
# client address in the audit log and the login rate limiter, but only when the
# server was started with --trusted-proxies naming this proxy's address --
# otherwise the header is ignored and every request is recorded as 127.0.0.1.
# See docs/OPERATIONS.md "Reverse proxy" for what --insecure means for the
# certificate pin agents use.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # `listen ... http2` works on every nginx release; on 1.25.1+ it only logs a
    # deprecation warning (the replacement `http2 on;` is unknown to older builds).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rmm.example.lan;

    ssl_certificate     /etc/ssl/certs/rmm.example.lan.crt;
    ssl_certificate_key /etc/ssl/private/rmm.example.lan.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 64m;   # file uploads to devices (fs/upload) are raw bodies

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /ws/*
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Agents keep one socket open for days; desktop sessions stream video.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Server-Sent Events and streamed script output must not be buffered.
        proxy_buffering off;
        proxy_cache     off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name rmm.example.lan;
    return 301 https://$host$request_uri;
}
